
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d20">
  <title>VIII</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: #f8edda;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at 20% 15%, #303d70, transparent 35%),
        radial-gradient(circle at 85% 85%, #202a50, transparent 38%),
        #080d20;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 20% 30%, #fff 99%, transparent),
        radial-gradient(2px 2px at 70% 20%, #e4d5ac 99%, transparent),
        radial-gradient(1px 1px at 80% 65%, #fff 99%, transparent),
        radial-gradient(1px 1px at 35% 80%, #fff 99%, transparent),
        radial-gradient(2px 2px at 55% 45%, #e4d5ac 99%, transparent);
      background-size: 240px 240px;
      opacity: 0.7;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 410px;
      padding: 34px 24px;
      text-align: center;
      background: #131a30ef;
      border: 1px solid #c7b98a66;
      border-radius: 24px;
      box-shadow: 0 15px 50px #0008;
    }

    .title {
      font-size: 14px;
      letter-spacing: 8px;
      color: #c7b98a;
      direction: ltr;
    }

    .moon {
      margin: 24px 0 12px;
      font-size: 76px;
      color: #f4e4b8;
      text-shadow: 0 0 32px #f4e4b888;
    }

    h1 {
      font-size: 25px;
      font-weight: normal;
      line-height: 1.6;
    }

    p {
      color: #d4d9e9;
      line-height: 2;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      color: white;
      background: #080d20;
      border: 1px solid #657092;
      text-align: center;
    }

    button {
      border: none;
      background: #e4d5ac;
      color: #171a30;
      cursor: pointer;
    }

    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca8c9;
    }

    #status {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <main class="card">
    <div class="title">VIII</div>

    <div class="moon" aria-hidden="true">☾</div>

    <h1>A little corner of the universe</h1>

    <p>
      Some things are special simply because they belong to one person.
    </p>

    <p>
      هناك أشياء مميزة، لأنها كُتبت لشخص واحد فقط ♡
    </p>

    <form id="form">
      <label for="password">Enter the password</label>

      <input
        id="password"
        type="password"
        placeholder="Your secret key"
        autocomplete="current-password"
        required
      >

      <button type="submit">Open your letter ✦</button>
    </form>

    <p id="status" role="status"></p>

    <p class="note">
      made for one person, under the same sky ✧
    </p>
  </main>

  <script>
    document.getElementById("form").addEventListener(
      "submit",
      function(event) {
        event.preventDefault();

        document.getElementById("status").textContent =
          "سيتم تفعيل الدخول الآمن قريبًا ✦";
      }
    );
  </script>
</body>
</html>
